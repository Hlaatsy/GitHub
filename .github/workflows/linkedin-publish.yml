name: Publish scheduled LinkedIn posts

on:
  schedule:
    # Hourly during SA business hours on weekdays (05:00-15:00 UTC is
    # 07:00-17:00 SAST). LinkedIn has no scheduled-post endpoint, so this
    # cadence is the granularity a publish_at time can be honoured to.
    # ~240 runs/month instead of ~730, which matters on a private repo
    # drawing from the 2,000 free Actions minutes.
    - cron: "0 5-15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what is due without posting"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: linkedin-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Report token lifetime
        env:
          LINKEDIN_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_TOKEN_EXPIRES_AT }}
          LINKEDIN_SCHEDULE_ENDS_AT: ${{ vars.LINKEDIN_SCHEDULE_ENDS_AT }}
        run: |
          python -m linkedin token || true
          # All three apps at a glance: which can publish, what is missing.
          python -m linkedin profiles || true

      - name: Publish due posts
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_TOKEN_EXPIRES_AT }}
          LINKEDIN_SCHEDULE_ENDS_AT: ${{ vars.LINKEDIN_SCHEDULE_ENDS_AT }}
          # StoreBurst and IDENTICAL are separate apps with separate tokens,
          # selected by a post's `profile:` front matter. A post whose profile
          # has no token here fails that post and leaves the rest of the queue
          # alone, rather than publishing as another brand.
          LINKEDIN_STOREBURST_ACCESS_TOKEN: ${{ secrets.LINKEDIN_STOREBURST_ACCESS_TOKEN }}
          LINKEDIN_STOREBURST_AUTHOR_URN: ${{ secrets.LINKEDIN_STOREBURST_AUTHOR_URN }}
          LINKEDIN_STOREBURST_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_STOREBURST_TOKEN_EXPIRES_AT }}
          LINKEDIN_IDENTICAL_ACCESS_TOKEN: ${{ secrets.LINKEDIN_IDENTICAL_ACCESS_TOKEN }}
          LINKEDIN_IDENTICAL_AUTHOR_URN: ${{ secrets.LINKEDIN_IDENTICAL_AUTHOR_URN }}
          LINKEDIN_IDENTICAL_TOKEN_EXPIRES_AT: ${{ secrets.LINKEDIN_IDENTICAL_TOKEN_EXPIRES_AT }}
        run: |
          python -m linkedin publish ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit archived posts
        if: ${{ !inputs.dry_run }}
        run: |
          if [ -z "$(git status --porcelain content/)" ]; then
            echo "Nothing published this run."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          git commit -m "Archive published LinkedIn posts"
          git push
