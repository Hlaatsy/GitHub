map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name yourdomain.co.za; # Replace with your registered local domain

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name yourdomain.co.za; # Replace with your registered local domain
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/yourdomain.co.za/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.co.za/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Webhook bodies are small; the app enforces tighter per-route limits.
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        # Overwrite rather than append: the app trusts exactly one proxy hop,
        # and the payment webhook IP allowlist relies on this being the real client.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        # The payment webhook verifies with Ozow before answering.
        proxy_read_timeout 30s;
    }
}
